springdoc.api-docs.path=/api-docs
spring.jackson.default-property-inclusion=non_empty
server.servlet.contextPath=/
server.port=4840

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/employee?useSSL=false&characterEncoding=utf8
spring.datasource.username=EmployeeManage
spring.datasource.password=EmployeeManage
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.opcfoundation.uawebservicedemo.database.entity
mybatis.configuration.map-underscore-to-camel-case=true

